name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25          # a hang must fail fast, not wait for the 6-hour default
    strategy:
      fail-fast: false
      matrix:
        # macos-15 = the image the release build uses; `macos-latest` may point at a newer macOS
        os: [ubuntu-latest, windows-latest, macos-15]
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xkb1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          tools/ci_run.sh "pip install" pip install -e ".[test]"
      - name: Test
        timeout-minutes: 15
        # -v shows which test is running; a test stuck for 120 s dumps every thread's stack (faulthandler_timeout)
        run: tools/ci_run.sh "pytest" python -m pytest -v
      - name: Headless self-test (source tree)
        timeout-minutes: 5
        run: |
          tools/ci_run.sh "self-test" python -m pinshot --selftest "$PWD/selftest.txt"
          cat selftest.txt
          grep -q "RESULT OK" selftest.txt || { echo "::error title=self-test not OK::$(grep -E 'FAIL|Error' selftest.txt | head -5 | tr '\n' ' ')"; exit 1; }
