name: Release

# Push a tag like v2.1.0  ->  builds every platform and publishes a GitHub Release with all downloads.
# Manual run: Actions > Rust release > Run workflow. Give a tag to publish, or leave it empty to only build artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v2.1.0 (empty = build only, no release)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux amd64", runner: ubuntu-22.04, arch: amd64 }
          - { name: "Linux arm64", runner: ubuntu-24.04-arm, arch: arm64 }
          - { name: "Windows amd64", runner: windows-latest, arch: amd64 }
          - { name: "macOS arm64", runner: macos-15, arch: arm64 }
          - { name: "macOS amd64", runner: macos-15-intel, arch: amd64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp version from tag
        if: env.RELEASE_TAG != ''
        run: python packaging/package.py stamp "$RELEASE_TAG"

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libx11-dev libxcb1-dev libdbus-1-dev dpkg-dev

      - name: Build macOS system-sound helper (Swift, ScreenCaptureKit)
        if: runner.os == 'macOS'
        run: bash packaging/macos/build_audiotap.sh

      - name: Install Inno Setup (Windows installer)
        if: runner.os == 'Windows'
        continue-on-error: true # without it only the portable zip is produced
        run: choco install innosetup -y --no-progress

      - run: pip install imageio-ffmpeg
      - run: cargo build --release -p pinshot

      - name: Self-test the built binary
        timeout-minutes: 5
        run: |
          ./target/release/pinshot --version
          # no display on CI runners: only the checks that do not need one must pass
          ./target/release/pinshot --selftest || true

      - name: Package
        run: python packaging/package.py pack --arch ${{ matrix.arch }}

      - name: Verify .deb installs and starts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./release/*.deb
          pinshot --version
          test -x /opt/pinshot/ffmpeg

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runner }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Verify all required downloads exist
        run: |
          ls -la artifacts
          missing=0
          for pat in "linux-amd64.deb" "linux-amd64.tar.gz" "linux-arm64.deb" "linux-arm64.tar.gz" \
                     "windows-amd64.zip" "macos-arm64.dmg" "macos-amd64.dmg"; do
            if ! ls artifacts/*"$pat" >/dev/null 2>&1; then echo "MISSING: $pat"; missing=1; fi
          done
          [ "$missing" = 0 ]

      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: PinShot ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
          body: |
            Rust edition: one native binary, no Python or Qt. Settings file and shortcuts are compatible with the Python edition.

            **macOS:** ad-hoc signed, not notarised. On first launch right-click the app > Open, then grant
            *Screen Recording* (and *Microphone* when recording audio) in System Settings > Privacy & Security.
            **Linux:** `sudo apt install ./PinShot-*.deb`. Wayland captures through the desktop portal; global hotkeys may be
            unavailable, bind a desktop shortcut to `pinshot --capture`.
