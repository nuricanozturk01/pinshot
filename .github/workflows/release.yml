name: Release

# Push a tag like v1.0.0  ->  builds every platform, then publishes a GitHub Release with all downloads.
# Manual run:  Actions > Release > Run workflow. Give a tag to publish, or leave it empty to only build artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.0.0 (empty = build only, no release)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux amd64",   runner: ubuntu-22.04,    arch: amd64, experimental: false }
          - { name: "Linux arm64",   runner: ubuntu-24.04-arm, arch: arm64, experimental: false }
          - { name: "Windows amd64", runner: windows-latest,  arch: amd64, experimental: false }
          - { name: "Windows arm64", runner: windows-11-arm,  arch: arm64, experimental: true }
          - { name: "macOS arm64",   runner: macos-15,        arch: arm64, experimental: false }
          - { name: "macOS amd64",   runner: macos-15-intel,  arch: amd64, experimental: false }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Stamp version from tag
        if: env.RELEASE_TAG != ''
        run: python tools/set_version.py "$RELEASE_TAG"

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xkb1 dpkg-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build,test]"
          # headless OpenCV: same API, ~100 MB smaller bundle, no GTK dependency
          if python -c "import cv2" 2>/dev/null; then
            pip uninstall -y opencv-python
            pip install --force-reinstall --no-deps opencv-python-headless
          fi

      - name: Generate icons
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_icons.py

      - name: Build application (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/pinshot.spec

      - name: Self-test built app (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then BIN="dist/PinShot.app/Contents/MacOS/PinShot"; else BIN="dist/PinShot/PinShot"; fi
          "$BIN" --selftest "$PWD/selftest.txt" || true
          cat selftest.txt
          grep -q "RESULT OK" selftest.txt

      - name: Self-test built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\PinShot\PinShot.exe" -ArgumentList "--selftest","$PWD\selftest.txt" -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path selftest.txt -Pattern "RESULT OK" -Quiet)) { throw "self-test did not report OK" }

      - name: Install Inno Setup (Windows installer)
        if: runner.os == 'Windows'
        continue-on-error: true      # without it only the portable zip is produced
        run: choco install innosetup -y --no-progress

      - name: Package
        run: python packaging/package.py --arch ${{ matrix.arch }}

      - name: Verify .deb installs and starts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./release/*.deb
          pinshot --version

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runner }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Verify all required downloads exist
        run: |
          ls -la artifacts
          missing=0
          for pat in "linux-amd64.deb" "linux-amd64.tar.gz" "linux-arm64.deb" "linux-arm64.tar.gz" \
                     "windows-amd64.zip" "macos-arm64.dmg" "macos-amd64.dmg"; do
            if ! ls artifacts/*"$pat" >/dev/null 2>&1; then echo "MISSING: $pat"; missing=1; fi
          done
          [ "$missing" = 0 ]

      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: PinShot ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
          body: |
            ## Downloads
            | Platform | amd64 / x64 | arm64 |
            |---|---|---|
            | Windows | `*-windows-amd64-setup.exe` (installer) or `.zip` (portable) | `*-windows-arm64-*` (experimental) |
            | macOS | `*-macos-amd64.dmg` (Intel) | `*-macos-arm64.dmg` (Apple Silicon) |
            | Linux | `*-linux-amd64.deb` / `.tar.gz` | `*-linux-arm64.deb` / `.tar.gz` |

            Verify downloads with `SHA256SUMS.txt`.

            **macOS:** the app is ad-hoc signed, not notarised. On first launch right-click the app > Open, then grant
            *Screen Recording* (and *Accessibility* for global hotkeys) in System Settings > Privacy & Security.
            **Linux:** `sudo apt install ./PinShot-*.deb`. Wayland: global hotkeys are unavailable; bind a desktop shortcut to `pinshot --capture`.
