name: Wayland

# Ubuntu 24.04+ sessions are Wayland: run the app in a headless sway (screenshots through grim).
# Slow (installs a desktop stack), so it is not part of CI. Manual run: Actions > Wayland > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wayland-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  wayland:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Libraries and a headless Wayland session
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libx11-dev libxcb1-dev libdbus-1-dev ffmpeg \
            sway swaybg xwayland grim dbus-x11 python3-pil
      - run: cargo build -p pinshot
      - name: PinShot under Wayland
        run: tools/wayland_ci.sh target/debug/pinshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayland-out
          path: wayland-out/
          retention-days: 7
