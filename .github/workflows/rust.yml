name: CI

on:
  push:
    branches: [main]
    paths:
      [
        "crates/**",
        "Cargo.toml",
        "Cargo.lock",
        "assets/**",
        "rustfmt.toml",
        ".prettierrc.json",
        ".github/workflows/rust.yml",
        "packaging/**",
      ]
  pull_request:
    paths:
      [
        "crates/**",
        "Cargo.toml",
        "Cargo.lock",
        "assets/**",
        "rustfmt.toml",
        ".prettierrc.json",
        ".github/workflows/rust.yml",
        "packaging/**",
      ]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libx11-dev libxcb1-dev libdbus-1-dev
      - run: cargo fmt --all --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prettier (workflows and docs of the Rust edition)
        run: npx --yes prettier@3 --check .
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libx11-dev libxcb1-dev libdbus-1-dev ffmpeg
      - run: cargo test --workspace
      # the lint job runs on Linux only: lint the Windows-only code too
      - name: Clippy (Windows)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings
      # real desktop session on the runner: the first frame of a window must reach the screen, and the screen
      # must be capturable. (--selftest also reports ffmpeg, which the runner does not have, so it only informs.)
      - name: Window smoke test and self-test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build -p pinshot
          ./target/debug/pinshot.exe --selftest || true
          ./target/debug/pinshot.exe --selftest-window

  # The headless Wayland (sway) job lives in wayland.yml and runs on demand.
