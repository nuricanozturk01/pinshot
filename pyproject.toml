[project]
name = "pinshot"
dynamic = ["version"]
description = "Cross-platform screenshot, annotate, OCR and pin-to-screen tool"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9,<3.13"
dependencies = [
  "PySide6-Essentials>=6.6,<7",
  "pynput>=1.7.6",
  "numpy>=1.24",
  "soundcard>=0.4.3",             # microphone + system-sound capture (WASAPI loopback / PulseAudio monitor)
  # offline OCR; no onnxruntime wheels for Windows on ARM
  "rapidocr_onnxruntime>=1.3.24; (sys_platform != 'win32' or platform_machine != 'ARM64')",
  # bundled ffmpeg for MP4/GIF recording; no wheel for Windows on ARM (a system ffmpeg is used there)
  "imageio-ffmpeg>=0.5.1; (sys_platform != 'win32' or platform_machine != 'ARM64')",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10", "pillow>=10.1"]
test = ["pytest>=8", "pillow>=10.1"]

[project.scripts]
pinshot = "pinshot.app:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pinshot"]

[tool.setuptools.dynamic]
version = { attr = "pinshot.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
faulthandler_timeout = 120        # a hung test prints every thread's stack instead of freezing silently
